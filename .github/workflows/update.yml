name: Update Portfolio Data

on:
  schedule:
    # 21:05 UTC on weekdays ~= 4:05pm ET (US market close) during EDT.
    # Adjust the cron for your timezone / how often you want updates -
    # e.g. every 30 min during market hours: "*/30 14-21 * * 1-5"
    - cron: "5 21 * * 1-5"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run updater
        run: python scripts/update_data.py

      - name: Commit updated data
        run: |
          git config user.name "portfolio-bot"
          git config user.email "actions@github.com"
          git add data/live.json data/history.csv data/history.json
          git diff --cached --quiet || git commit -m "Update portfolio data ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push
