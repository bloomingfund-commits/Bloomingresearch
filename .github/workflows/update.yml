name: Rebuild Dashboard Data

on:
  push:
    branches: [main]
    paths:
      - "data/closed_positions.csv"
      - "notes/**"
      - "scripts/**"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run builder
        run: python scripts/update_data.py

      - name: Commit updated data
        run: |
          git config user.name "portfolio-bot"
          git config user.email "actions@github.com"
          git add data/live.json
          git diff --cached --quiet || git commit -m "Rebuild dashboard data ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push
